# 안드로이드 APK: 바뀐 앱만 빌드 (공통 코드가 바뀌면 전체)
# main 에 push 하면 Releases 에 <앱>-android-<번호> 로 APK 게시
name: Android APK

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: echo "list=$(node scripts/changed-apps.mjs)" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      # 앱마다 store(Play 배포용·광고 있음) + family(아이용·광고 없음, 광고를 쓰는 앱만)
      - id: matrix
        run: echo "matrix=$(node scripts/android-matrix.mjs '${{ steps.list.outputs.list }}')" >> "$GITHUB_OUTPUT"

  build:
    needs: apps
    if: needs.apps.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.apps.outputs.matrix) }}
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      APP_VARIANT: ${{ matrix.variant }} # store | family (scripts/android-variant.mjs)
      VITE_ADS: ${{ matrix.variant == 'family' && '0' || '1' }} # 아이용 빌드는 광고 코드도 끔
      NAME: ${{ matrix.variant == 'family' && format('{0}-family', matrix.app) || matrix.app }} # 파일·아티팩트 이름
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build
      # 아이용(family): 패키지 이름 뒤에 .family, 광고 플러그인 제외 (store 는 변화 없음)
      - run: node ../../scripts/android-variant.mjs
      # android 폴더가 저장소에 없으면 CI 에서 생성 (아이콘·권한을 바꾸려면 PC에서 만들어 커밋)
      - run: '[ -d android ] || npx cap add android'
      # 앱 아이콘 (icon-1024.png / icon-android.png → 안드로이드 아이콘)
      - run: bash ../../scripts/android-icons.sh
      - run: npx cap sync android
      # 애드몹 앱 ID·권한 빼기 (apps/<앱>/android.json 이 있을 때만)
      - run: node ../../scripts/android-manifest.mjs
      # 버전: versionCode 는 빌드 번호(올릴 때마다 커야 함), versionName 은 앱 package.json 의 version
      - run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$(node -p "require('./package.json').version")\"/" android/app/build.gradle
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ env.NAME }}.apk
      # Play 스토어 업로드용 AAB (업로드 키가 저장소 Secrets 에 있을 때만). 키 만드는 법: docs/release/README.md
      - name: Play 업로드용 AAB (서명)
        if: env.HAS_UPLOAD_KEY == 'true' && matrix.variant == 'store'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          (cd android && ./gradlew bundleRelease)
          aab=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KEYSTORE_PASS" -keypass "$KEY_PASS" "$aab" "$KEY_ALIAS"
          cp "$aab" ${{ matrix.app }}.aab
          rm -f "$RUNNER_TEMP/upload.jks"
      - if: env.HAS_UPLOAD_KEY == 'true' && matrix.variant == 'store'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-aab
          path: apps/${{ matrix.app }}/${{ matrix.app }}.aab
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-apk
          path: apps/${{ matrix.app }}/${{ env.NAME }}.apk
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NAME }}-android-${{ github.run_number }}
          name: ${{ env.NAME }} Android build ${{ github.run_number }}
          files: apps/${{ matrix.app }}/${{ env.NAME }}.apk
