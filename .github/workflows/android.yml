# 안드로이드 APK: 바뀐 앱만 빌드 (공통 코드가 바뀌면 전체)
# main 에 push 하면 Releases 에 <앱>-android-<번호> 로 APK 게시
name: Android APK

on:
  push:
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: list
        run: echo "list=$(node scripts/changed-apps.mjs)" >> "$GITHUB_OUTPUT"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

  build:
    needs: apps
    if: needs.apps.outputs.list != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.apps.outputs.list) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: .
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build
      # android 폴더가 저장소에 없으면 CI 에서 생성 (아이콘·권한을 바꾸려면 PC에서 만들어 커밋)
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.app }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: apps/${{ matrix.app }}/${{ matrix.app }}.apk
      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.app }}-android-${{ github.run_number }}
          name: ${{ matrix.app }} Android build ${{ github.run_number }}
          files: apps/${{ matrix.app }}/${{ matrix.app }}.apk
