# 웹 미리보기: 모든 앱을 빌드해 GitHub Pages 에 배포 → https://compcwgit.github.io/family-apps/<앱>/
name: Web Preview (Pages)

on:
  # 브랜치 미리보기를 원하면: Settings → Environments → github-pages → Deployment branches 를
  # No restriction 으로 바꾸고 아래 branches 줄을 지우세요
  # external(외부 작업)도 배포 → 폰에서 바로 확인. 마지막에 push한 브랜치가 사이트에 보임
  # external 배포가 막히면: Settings → Environments → github-pages → Deployment branches 에 external 추가
  push:
    branches: [main, external]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
